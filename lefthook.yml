pre-commit:
  parallel: true
  jobs:
    - name: format and lint
      group:
        piped: true
        jobs:
          - name: format
            run: bun oxfmt --write {staged_files}
            glob: "*.{js,jsx,ts,tsx,json,css,md,yml}"
            stage_fixed: true

          - name: lint
            run: bun oxlint --fix {staged_files}
            glob: "*.{ts,tsx,js,jsx}"
            stage_fixed: true

    # Example: add independent tasks that can run in parallel
    # - name: other task
    #   run: bun other-task.ts {staged_files}
    #   glob: "*.{ts,tsx,js,jsx}"
    #   stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    run-tests:
      run: bun run tests || bun test

    run-audit:
      run: bun audit
      fail_text: |
        Security vulnerabilities detected.
        Run `bun audit fix` manually to try resolving them.

    # Lint is repeated here, but over the WHOLE project instead of {staged_files}.
    # Reason: in pre-commit, lint only runs on staged files, so a type change in
    # one file can break integration/type-check in other files that weren't
    # touched in that commit and therefore never went through the linter. Before
    # pushing (once you have the full picture of all commits), it's worth
    # running lint over the whole repo to catch those cross-file breakages
    # before they reach the remote.
    run-lint-full:
      run: bun oxlint .
      glob: "*.{ts,tsx,js,jsx}"
