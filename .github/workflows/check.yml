name: Check

on:
  workflow_call:
    inputs:
      is_pull_request:
        type: boolean
        default: false
      base_sha:
        type: string
        default: ""
      head_sha:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        task:
          - format
          - lint
          - tests
          - commitlint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.task }}
        run: |
          case "${{ matrix.task }}" in
            format)    bun oxfmt --check . ;;
            lint)      bun oxlint ;;
            tests)     bun run tests || bun test ;;
            commitlint)
              if [ "${{ inputs.is_pull_request }}" != "true" ]; then
                echo "Skipping commitlint"
                exit 0
              fi

              bunx commitlint \
                --from "${{ inputs.base_sha }}" \
                --to "${{ inputs.head_sha }}"
              ;;
          esac
        shell: bash
