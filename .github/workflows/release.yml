name: Release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: |
          echo "Checking for 'build' script in package.json"

          bun - <<'BUN'
          const fs = require('node:fs');

          try {
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const scripts = pkg?.scripts ?? {};

            if (Object.prototype.hasOwnProperty.call(scripts, 'build')) {
              console.log("Found 'build' script in package.json");
              process.exit(0);
            }

            console.log("No 'build' script found in package.json");
            process.exit(2);
          } catch (error) {
            console.error(`Error checking package.json: ${String(error)}`);
            process.exit(1);
          }
          BUN

          check_exit=$?
          if [ "$check_exit" -eq 0 ]; then
            echo "'build' script present. Running 'bun run build'"
            if ! bun run build; then
              echo "'bun run build' failed"
              exit 1
            fi
          elif [ "$check_exit" -eq 2 ]; then
            echo "No 'build' script found — skipping build step"
          else
            echo "build check failed (exit code $check_exit) — skipping build step and logging"
          fi

      # Node.js is currently required only because `bunx` does not support
      # multiple `--package` arguments in a single temporary environment.
      #
      # This forces the workflow to install both Bun and Node.js, even though
      # the release toolchain itself could otherwise be executed with Bun.
      #
      # Once Bun supports this functionality, this step can be removed and
      # the release command can be changed from `npx` to `bunx`.
      #
      # See: https://github.com/oven-sh/bun/issues/39444
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx
          --package semantic-release@25
          --package @semantic-release/exec@6.0.3
          --package conventional-changelog-conventionalcommits@9
          --package typescript@5.9.3
          semantic-release
